<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
    .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .rise { opacity: 0; animation: rise 700ms cubic-bezier(.2,.7,.3,1) forwards; }
    .r1 { animation-delay: 150ms; } .r2 { animation-delay: 320ms; } .r3 { animation-delay: 500ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: pulse 7s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  </style>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 10) scale(260)">
      <stop stop-color="#e2a13c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e2a13c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="230" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="#0f1317"/>
    <circle class="glow" cx="170" cy="10" r="260" fill="url(#glow)"/>
    <circle class="glow" cx="870" cy="220" r="200" fill="url(#glow)" style="animation-delay:3s"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="229" rx="17.5" fill="none" stroke="#232a33"/>
  <text class="mono rise" x="64" y="70" font-size="15" fill="#9aa1ab"><tspan fill="#e2a13c">~</tspan> faisalabad, pakistan · utc+05</text>
  <text class="sans rise r1" x="62" y="130" font-size="47" font-weight="700" fill="#e8e6e1" letter-spacing="-1.5">Hassan Naveed<tspan fill="#e2a13c">.</tspan></text>
  <text class="sans rise r2" x="64" y="169" font-size="20" fill="#9aa1ab">Senior Software Engineer — Full-Stack · SaaS · AI / RAG</text>
  <text class="mono rise r3" x="64" y="203" font-size="14" fill="#9aa1ab">hassan-naveed.vercel.app <tspan class="cursor" fill="#e2a13c">▍</tspan></text>
</svg>
